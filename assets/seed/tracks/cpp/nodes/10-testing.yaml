  minimum_pass_line: "能指出单测只覆盖编写者预设的用例，模糊测试通过随机变异构造出人工难以想象的畸形输入"
  on_failure: "AI 演示 libFuzzer 捕获溢出输入的实际运行过程，通过后回归本节点"
acceptance_criteria:
  - "能为核心解析模块编写单元测试与模糊测试入口"
