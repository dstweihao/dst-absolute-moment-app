name: absolute_moment_app
description: 绝对时刻APP —— 苏格拉底反诘法移动学习引擎
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 路由
  go_router: ^18.0.2

  # 网络：WebDAV 客户端自研（见 lib/data/webdav/raw_webdav_adapter.dart）
  # 不引 webdav_client —— 该包停更于 2024-05，已自行实现以避免依赖风险
  http: ^1.6.0
  xml: ^7.1.0

  # 数据格式：Markdown + YAML 头部
  yaml: ^3.1.4

  # 本地存储：凭证加密 + UI 偏好 + 静态缓存目录
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.0

  # 图表
  fl_chart: ^1.2.0

  # 工具
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  # 测试里替掉插件通道（临时目录 / 拉起文件），不引入运行时依赖
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # 与前景母版里的方块同色 —— 方块边缘因此隐入背景，只留白色标记
  adaptive_icon_background: "#165DFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#165DFF"
    theme_color: "#165DFF"